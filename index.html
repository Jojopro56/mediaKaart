<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Volvo Rutten x PEDAL Gravel Ride - Media Guide</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg: #090d16;
      --card: #151e2e;
      --card-border: #243247;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --route-52: #22c55e;
      --route-81: #f97316;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      background: rgba(15, 23, 42, 0.98);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
    }

    .title h1 { font-size: 15px; font-weight: 700; color: #fff; }
    .title p { font-size: 11px; color: var(--text-dim); }

    .header-actions { display: flex; gap: 6px; }

    .btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn.active {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
    }

    /* Draaiboek Sequentie Balk */
    .timeline-banner {
      background: #1e293b;
      border-bottom: 2px solid var(--gold);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      animation: slideDown 0.2s ease-out;
    }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    .timeline-info { display: flex; flex-direction: column; }
    .timeline-step { font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; }
    .timeline-title { font-size: 13px; font-weight: 700; color: #fff; }
    .timeline-time { font-size: 11px; color: var(--accent); }

    .timeline-nav { display: flex; gap: 6px; }
    .nav-arrow {
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Filter Balk */
    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      white-space: nowrap;
      z-index: 1000;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .chip {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text-dim);
      cursor: pointer;
    }
    .chip.active { color: #fff; border-color: transparent; }
    .chip.c-52.active { background: var(--route-52); }
    .chip.c-81.active { background: var(--route-81); }
    .chip.c-all.active { background: #64748b; }
    .chip.c-pauze.active { background: #a855f7; }
    .chip.c-fpv.active { background: #ec4899; }
    .chip.c-drone.active { background: #06b6d4; }
    .chip.c-broll.active { background: #eab308; }

    #map { flex: 1; width: 100%; }

    /* Custom genummerde pins */
    .num-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 800;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
      transition: transform 0.2s;
    }
    .num-pin.highlighted {
      transform: scale(1.35);
      border-color: #fef08a;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.9);
    }

    /* Bottom Sheet Modal */
    .bottom-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--card-border);
      padding: 16px 18px env(safe-area-inset-bottom, 16px);
      box-shadow: 0 -8px 24px rgba(0,0,0,0.7);
      transform: translateY(110%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      max-height: 72vh;
      overflow-y: auto;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: #475569; border-radius: 2px; margin: 0 auto 12px; }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .sheet-title { font-size: 16px; font-weight: 700; color: #fff; }
    .sheet-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; color: #fff; }
    .sheet-time-box {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .sheet-time { color: var(--gold); }
    .sheet-peloton { color: var(--accent); }
    .sheet-desc { font-size: 13px; line-height: 1.45; color: #cbd5e1; margin-bottom: 12px; }
    .sheet-tips {
      background: rgba(11, 19, 41, 0.6);
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      font-size: 12px;
      color: #94a3b8;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .nav-btn {
      display: block; width: 100%; text-align: center; background: #2563eb; color: white;
      text-decoration: none; font-weight: 600; font-size: 13px; padding: 12px; border-radius: 10px;
    }
  </style>
</head>

  <header>
    <div class="title">
      <h1>Volvo Rutten Media Map</h1>
      <p>Productie & Live Draaiboek</p>
    </div>
    <div class="header-actions">
      <button class="btn active" id="timeline-toggle-btn" onclick="toggleTimelineMode()">⏱️ Draaiboek</button>
      <button class="btn" onclick="toggleTileLayer()" id="layer-btn">🛰️ Satelliet</button>
      <button class="btn" onclick="toggleGPS()" id="gps-btn">📍 GPS</button>
    </div>
  </header>

  <!-- Sequentieel Draaiboek Banner -->
  <div id="timeline-banner" class="timeline-banner">
    <div class="timeline-info">
      <span class="timeline-step" id="tl-step">Stap 1 van 7</span>
      <span class="timeline-title" id="tl-title">Locatie laden...</span>
      <span class="timeline-time" id="tl-time">08:00 - 09:15</span>
    </div>
    <div class="timeline-nav">
      <button class="nav-arrow" onclick="prevTimelineStep()">◀</button>
      <button class="nav-arrow" onclick="nextTimelineStep()">▶</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="chip c-52 active" onclick="toggleRoute('52')">🟢 52 km</div>
    <div class="chip c-81 active" onclick="toggleRoute('81')">🟠 81 km</div>
    <div class="chip c-all active" onclick="filterPins('all')">Alle Pins</div>
    <div class="chip c-pauze" onclick="filterPins('Pauze')">Pauzeplaats</div>
    <div class="chip c-fpv" onclick="filterPins('FPV')">FPV Dives</div>
    <div class="chip c-drone" onclick="filterPins('Drone')">Drone Track</div>
    <div class="chip c-broll" onclick="filterPins('B-roll')">B-roll Grond</div>
  </div>

  <div id="map"></div>

  <!-- Bottom Sheet -->
  <div id="bottom-sheet" class="bottom-sheet">
    <div class="sheet-handle" onclick="closeSheet()"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title">Locatie</div>
      <span class="sheet-badge" id="sheet-badge">SHOT</span>
    </div>
    <div class="sheet-time-box">
      <span class="sheet-time" id="sheet-time">⏰ Tijd</span>
      <span class="sheet-peloton" id="sheet-peloton">🚴 Peloton</span>
    </div>
    <div class="sheet-desc" id="sheet-desc">Beschrijving</div>
    <div class="sheet-tips" id="sheet-tips">Tips</div>
    <a href="#" target="_blank" id="sheet-nav" class="nav-btn">Navigeer direct via Google Maps</a>
  </div>

    const poly52 = L.polyline(coords52, { color: '#22c55e', weight: 4.5, opacity: 0.9 }).addTo(map);
    const poly81 = L.polyline(coords81, { color: '#f97316', weight: 4.5, opacity: 0.9 }).addTo(map);

    map.fitBounds(poly81.getBounds(), { padding: [20, 20] });

    // --- SEQUENTIËLE PRODUCTIE LOCATIES (Exacte coördinaten uit GPX) ---
    const sequenceSpots = [
      {

      },
      {

        time: '10:50 - 11:25',

        desc: 'Spectaculair hoogveengebied: kaarsrechte veendijk langs waterkanalen en 2 km singletrack tussen witte berken.',

        time: '12:25 - 13:15',
        peloton: 'Finale 52 km (km 41) & 81 km (km 73)',

    // Extra scoutingspot (optioneel): Singletrack Dorperdijk Sevenum
    const extraSpots = [
      {
        step: 0,
        title: 'Singletrack S1 Dorperdijk (Sevenum)',
        type: 'B-roll',
        color: '#eab308',
        coords: [51.415778, 6.042142], // Exact GPX punt op 52 km
        time: '10:35 - 11:00',
        peloton: '52 km doorkomst (km 11.5)',
        desc: 'Snelle singletrack door het bos net buiten Sevenum. Goed alternatief als je tussen start 50 km en de pauze nog actie wilt.',

        mapsUrl: 'https://www.google.com/maps?q=51.415778,6.042142'
      }
    ];

    // --- MARKERS AANMAKEN ---
    let markers = [];
    let currentStepIndex = 0;

    sequenceSpots.forEach((spot, idx) => {
      const el = document.createElement('div');
      el.className = 'num-pin';
      el.id = 'pin-marker-' + idx;
      el.style.width = '24px';
      el.style.height = '24px';
      el.style.background = spot.color;
      el.innerText = spot.step;

      const icon = L.divIcon({
        className: 'custom-leaflet-icon',
        html: el,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      const m = L.marker(spot.coords, { icon }).addTo(map);
      m.spotData = spot;
      m.spotIndex = idx;
      m.on('click', () => selectSpot(idx));
      markers.push(m);
    });

    // Extra marker toevoegen aan de kaart
    extraSpots.forEach(spot => {
      const el = document.createElement('div');
      el.className = 'num-pin';
      el.style.width = '20px';
      el.style.height = '20px';
      el.style.background = spot.color;
      el.innerText = '•';

      const icon = L.divIcon({ className: 'c-icon', html: el, iconSize: [20, 20], iconAnchor: [10, 10] });
      const m = L.marker(spot.coords, { icon }).addTo(map);
      m.spotData = spot;
      m.on('click', () => showDetails(spot));
      markers.push(m);
    });

    // --- DRAAIBOEK SEQUENTIE BESTURING ---
    function updateTimelineUI() {
      const spot = sequenceSpots[currentStepIndex];
      document.getElementById('tl-step').innerText = `Stap ${spot.step} van 7 (${spot.type})`;
      document.getElementById('tl-title').innerText = spot.title;
      document.getElementById('tl-time').innerText = `⏰ ${spot.time} | ${spot.peloton}`;

      // Markeer actieve pin met pulsing highlight
      document.querySelectorAll('.num-pin').forEach(p => p.classList.remove('highlighted'));
      const activeEl = document.getElementById('pin-marker-' + currentStepIndex);
      if (activeEl) activeEl.classList.add('highlighted');

      // Vlieg soepel naar locatie
      map.flyTo(spot.coords, 14, { duration: 0.8 });

      // Open details paneel
      showDetails(spot);
    }

    function selectSpot(idx) {
      currentStepIndex = idx;
      updateTimelineUI();
    }

    function nextTimelineStep() {
      if (currentStepIndex < sequenceSpots.length - 1) {
        currentStepIndex++;
        updateTimelineUI();
      }
    }

    function prevTimelineStep() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        updateTimelineUI();
      }
    }

    let timelineMode = true;
    function toggleTimelineMode() {
      timelineMode = !timelineMode;
      const banner = document.getElementById('timeline-banner');
      const btn = document.getElementById('timeline-toggle-btn');
      if (timelineMode) {
        banner.style.display = 'flex';
        btn.classList.add('active');
        updateTimelineUI();
      } else {
        banner.style.display = 'none';
        btn.classList.remove('active');
        document.querySelectorAll('.num-pin').forEach(p => p.classList.remove('highlighted'));
      }
    }

    // Detail Sheet
    function showDetails(spot) {
      document.getElementById('sheet-title').innerText = spot.step ? `${spot.step}. ${spot.title}` : spot.title;
      const badge = document.getElementById('sheet-badge');
      badge.innerText = spot.type;
      badge.style.background = spot.color;
      document.getElementById('sheet-time').innerText = `⏰ ${spot.time}`;
      document.getElementById('sheet-peloton').innerText = `🚴 ${spot.peloton}`;
      document.getElementById('sheet-desc').innerText = spot.desc;
      document.getElementById('sheet-tips').innerText = spot.tips;
      document.getElementById('sheet-nav').href = spot.mapsUrl;
      document.getElementById('bottom-sheet').classList.add('open');
    }

    function closeSheet() { document.getElementById('bottom-sheet').classList.remove('open'); }
    map.on('click', () => closeSheet());

    // Filter Buttons
    function toggleRoute(dist) {
      const chip = document.querySelector(`.c-${dist}`);
      if (dist === '52') {
        map.hasLayer(poly52) ? map.removeLayer(poly52) : map.addLayer(poly52);
        chip.classList.toggle('active', map.hasLayer(poly52));
      } else {
        map.hasLayer(poly81) ? map.removeLayer(poly81) : map.addLayer(poly81);
        chip.classList.toggle('active', map.hasLayer(poly81));
      }
    }

    function filterPins(type) {
      document.querySelectorAll('.filter-bar .chip').forEach(c => {
        if (!c.classList.contains('c-52') && !c.classList.contains('c-81')) c.classList.remove('active');
      });
      event.target.classList.add('active');

      markers.forEach(m => {
        if (type === 'all' || m.spotData.type === type) {
          map.addLayer(m);
        } else {
          map.removeLayer(m);
        }
      });
    }

    // GPS Tracking
    let userMarker = null;
    let watchingGPS = false;
    function toggleGPS() {
      const btn = document.getElementById('gps-btn');
      if (!watchingGPS) {
        if (!navigator.geolocation) return alert("Geen GPS op dit apparaat.");
        watchingGPS = true;
        btn.classList.add('active');
        navigator.geolocation.watchPosition(pos => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          if (!userMarker) {
            userMarker = L.circleMarker(latlng, { radius: 8, color: '#38bdf8', fillColor: '#0284c7', fillOpacity: 0.9, weight: 3 }).addTo(map);
            map.setView(latlng, 13);
          } else {
            userMarker.setLatLng(latlng);
          }
        }, err => {
          alert("GPS fout: " + err.message);
          btn.classList.remove('active');
          watchingGPS = false;
        }, { enableHighAccuracy: true });
      } else {
        watchingGPS = false;
        btn.classList.remove('active');
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      }
    }

    // Start direct met Stap 1 actief
    window.addEventListener('DOMContentLoaded', () => {
      updateTimelineUI();
    });
  </script>
